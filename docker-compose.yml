version: '3.8'

services:
  app:
    build: .
    container_name: projetoAutenticacao
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${SPRING_DATASOURCE_URL}
      - DB_USER=${SPRING_DATASOURCE_USERNAME}
      - DB_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT=${JWT}

      - REDIS_HOST=localhost
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: projetoAutenticacao-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data



  redis:
    image: redis:latest
    command: ${REQUIRE_PASSWORD_REDIS}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data: